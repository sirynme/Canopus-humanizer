[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canopus-humanizer"
version = "1.0.0"
description = "Deterministic rule-based text humanizer"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "canopus-humanizer", email = "canopus-humanizer@local" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "python-docx>=1.1.2",
]
